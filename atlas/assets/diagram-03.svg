<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="580" viewBox="0 0 1000 580" role="img" aria-label="补剂无效，先拆开问题关系图"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#19586B"></path></marker></defs><rect width="1000" height="580" rx="24" fill="#EDF5F6"></rect><g font-family="Microsoft YaHei,Arial,sans-serif"><rect x="340" y="25" width="320" height="102" rx="18" fill="white" stroke="#19586B" stroke-width="2"></rect><text x="500" y="67" font-size="25" fill="#19586B" text-anchor="middle" font-weight="700">目标是什么</text><text x="500" y="102" font-size="18" fill="#506875" text-anchor="middle" font-weight="400">症状、指标还是预防</text><path d="M500,127 L153.5,230" fill="none" stroke="#19586B" stroke-width="3" stroke-dasharray="7 7"></path><rect x="50" y="230" width="207" height="110" rx="18" fill="white" stroke="#19586B" stroke-width="2"></rect><text x="153.5" y="272" font-size="25" fill="#19586B" text-anchor="middle" font-weight="700">是否需要</text><text x="153.5" y="307" font-size="18" fill="#506875" text-anchor="middle" font-weight="400">饮食、病史与缺乏证据</text><path d="M153.5,340 L500,430" fill="none" stroke="#19586B" stroke-width="3" stroke-dasharray="7 7"></path><path d="M500,127 L378.5,230" fill="none" stroke="#19586B" stroke-width="3" stroke-dasharray="7 7"></path><rect x="275" y="230" width="207" height="110" rx="18" fill="white" stroke="#19586B" stroke-width="2"></rect><text x="378.5" y="272" font-size="25" fill="#19586B" text-anchor="middle" font-weight="700">是否到达</text><text x="378.5" y="307" font-size="18" fill="#506875" text-anchor="middle" font-weight="400">摄入、消化与吸收</text><path d="M378.5,340 L500,430" fill="none" stroke="#19586B" stroke-width="3" stroke-dasharray="7 7"></path><path d="M500,127 L603.5,230" fill="none" stroke="#19586B" stroke-width="3" stroke-dasharray="7 7"></path><rect x="500" y="230" width="207" height="110" rx="18" fill="white" stroke="#19586B" stroke-width="2"></rect><text x="603.5" y="272" font-size="25" fill="#19586B" text-anchor="middle" font-weight="700">如何评价</text><text x="603.5" y="307" font-size="18" fill="#506875" text-anchor="middle" font-weight="400">观察时间与客观变化</text><path d="M603.5,340 L500,430" fill="none" stroke="#19586B" stroke-width="3" stroke-dasharray="7 7"></path><path d="M500,127 L828.5,230" fill="none" stroke="#19586B" stroke-width="3" stroke-dasharray="7 7"></path><rect x="725" y="230" width="207" height="110" rx="18" fill="white" stroke="#19586B" stroke-width="2"></rect><text x="828.5" y="272" font-size="25" fill="#19586B" text-anchor="middle" font-weight="700">其他解释</text><text x="828.5" y="307" font-size="18" fill="#506875" text-anchor="middle" font-weight="400">疾病、药物与睡眠</text><path d="M828.5,340 L500,430" fill="none" stroke="#19586B" stroke-width="3" stroke-dasharray="7 7"></path><rect x="300" y="430" width="400" height="102" rx="18" fill="white" stroke="#19586B" stroke-width="2"></rect><text x="500" y="472" font-size="25" fill="#19586B" text-anchor="middle" font-weight="700">复盘决定</text><text x="500" y="507" font-size="18" fill="#506875" text-anchor="middle" font-weight="400">继续、调整或停止评估</text></g></svg>