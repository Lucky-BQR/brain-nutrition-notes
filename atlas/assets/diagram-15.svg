<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="580" viewBox="0 0 1000 580" role="img" aria-label="DHA、EPA 与脂质的角色关系图"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#A85345"></path></marker></defs><rect width="1000" height="580" rx="24" fill="#EDF5F6"></rect><g font-family="Microsoft YaHei,Arial,sans-serif"><rect x="485" y="35" width="2" height="465" fill="#C8DADD"></rect><rect x="45" y="48" width="400" height="115" rx="18" fill="white" stroke="#A85345" stroke-width="2"></rect><text x="245" y="90" font-size="25" fill="#A85345" text-anchor="middle" font-weight="700">DHA</text><text x="245" y="125" font-size="18" fill="#506875" text-anchor="middle" font-weight="400">参与细胞膜结构</text><rect x="45" y="198" width="400" height="115" rx="18" fill="white" stroke="#A85345" stroke-width="2"></rect><text x="245" y="240" font-size="25" fill="#A85345" text-anchor="middle" font-weight="700">EPA</text><text x="245" y="275" font-size="18" fill="#506875" text-anchor="middle" font-weight="400">参与脂质信号通路</text><rect x="45" y="348" width="400" height="115" rx="18" fill="white" stroke="#A85345" stroke-width="2"></rect><text x="245" y="390" font-size="25" fill="#A85345" text-anchor="middle" font-weight="700">食物来源</text><text x="245" y="425" font-size="18" fill="#506875" text-anchor="middle" font-weight="400">鱼类等膳食来源</text><rect x="550" y="48" width="400" height="115" rx="18" fill="white" stroke="#A85345" stroke-width="2"></rect><text x="750" y="90" font-size="25" fill="#A85345" text-anchor="middle" font-weight="700">补剂标签</text><text x="750" y="125" font-size="18" fill="#506875" text-anchor="middle" font-weight="400">实际 EPA 与 DHA 含量</text><rect x="550" y="198" width="400" height="115" rx="18" fill="white" stroke="#A85345" stroke-width="2"></rect><text x="750" y="240" font-size="25" fill="#A85345" text-anchor="middle" font-weight="700">心血管用药</text><text x="750" y="275" font-size="18" fill="#506875" text-anchor="middle" font-weight="400">按适应证评估</text><rect x="550" y="348" width="400" height="115" rx="18" fill="white" stroke="#A85345" stroke-width="2"></rect><text x="750" y="390" font-size="25" fill="#A85345" text-anchor="middle" font-weight="700">认识边界</text><text x="750" y="425" font-size="18" fill="#506875" text-anchor="middle" font-weight="400">结构作用≠治疗承诺</text><text x="500" y="550" font-size="20" fill="#607880" text-anchor="middle" font-weight="400">分开概念，逐项理解；不把两列视作等式</text></g></svg>