<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="580" viewBox="0 0 1000 580" role="img" aria-label="把学习变成可回顾的记录关系图"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#53713C"></path></marker></defs><rect width="1000" height="580" rx="24" fill="#EDF5F6"></rect><g font-family="Microsoft YaHei,Arial,sans-serif"><path d="M490,80 L815,230" fill="none" stroke="#53713C" stroke-width="3" stroke-dasharray="7 7"></path><path d="M815,230 L705,430" fill="none" stroke="#53713C" stroke-width="3" stroke-dasharray="7 7"></path><path d="M705,430 L265,430" fill="none" stroke="#53713C" stroke-width="3" stroke-dasharray="7 7"></path><path d="M265,430 L170,230" fill="none" stroke="#53713C" stroke-width="3" stroke-dasharray="7 7"></path><path d="M170,230 L490,80" fill="none" stroke="#53713C" stroke-width="3" stroke-dasharray="7 7"></path><ellipse cx="500" cy="283" rx="140" ry="65" fill="#E1EFF1"></ellipse><text x="500" y="292" font-size="29" fill="#53713C" text-anchor="middle" font-weight="700">观察与回顾</text><rect x="375" y="25" width="240" height="110" rx="18" fill="white" stroke="#53713C" stroke-width="2"></rect><text x="495" y="67" font-size="25" fill="#53713C" text-anchor="middle" font-weight="700">选一个问题</text><text x="495" y="102" font-size="18" fill="#506875" text-anchor="middle" font-weight="400">用具体语言描述</text><rect x="700" y="175" width="240" height="110" rx="18" fill="white" stroke="#53713C" stroke-width="2"></rect><text x="820" y="217" font-size="25" fill="#53713C" text-anchor="middle" font-weight="700">记录背景</text><text x="820" y="252" font-size="18" fill="#506875" text-anchor="middle" font-weight="400">饮食、睡眠、用药</text><rect x="590" y="375" width="240" height="110" rx="18" fill="white" stroke="#53713C" stroke-width="2"></rect><text x="710" y="417" font-size="25" fill="#53713C" text-anchor="middle" font-weight="700">理解证据</text><text x="710" y="452" font-size="18" fill="#506875" text-anchor="middle" font-weight="400">区分课堂与核查</text><rect x="150" y="375" width="240" height="110" rx="18" fill="white" stroke="#53713C" stroke-width="2"></rect><text x="270" y="417" font-size="25" fill="#53713C" text-anchor="middle" font-weight="700">选择小改变</text><text x="270" y="452" font-size="18" fill="#506875" text-anchor="middle" font-weight="400">适合自己的日常习惯</text><rect x="55" y="175" width="240" height="110" rx="18" fill="white" stroke="#53713C" stroke-width="2"></rect><text x="175" y="217" font-size="25" fill="#53713C" text-anchor="middle" font-weight="700">观察与回顾</text><text x="175" y="252" font-size="18" fill="#506875" text-anchor="middle" font-weight="400">变化、代价、下一步</text><text x="500" y="550" font-size="20" fill="#607880" text-anchor="middle" font-weight="400">环形表示相互联系 / 复盘循环</text></g></svg>