t-weight="400">过敏、不耐受等需区分</text><rect x="550" y="348" width="400" height="115" rx="18" fill="white" stroke="#6D638B" stroke-width="2"></rect><text x="750" y="390" font-size="25" fill="#6D638B" text-anchor="middle" font-weight="700">临床判断</text><text x="750" y="425" font-size="18" fill="#506875" text-anchor="middle" font-weight="400">不能用一个配方概括</text><text x="500" y="550" font-size="20" fill="#607880" text-anchor="middle" font-weight="400">分开概念，逐项理解；不把两列视作等式</text></g></svg>