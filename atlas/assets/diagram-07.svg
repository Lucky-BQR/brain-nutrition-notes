<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="580" viewBox="0 0 1000 580" role="img" aria-label="胃酸与反流：分开两个问题关系图"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#287F85"></path></marker></defs><rect width="1000" height="580" rx="24" fill="#EDF5F6"></rect><g font-family="Microsoft YaHei,Arial,sans-serif"><rect x="485" y="35" width="2" height="465" fill="#C8DADD"></rect><rect x="45" y="48" width="400" height="115" rx="18" fill="white" stroke="#287F85" stroke-width="2"></rect><text x="245" y="90" font-size="25" fill="#287F85" text-anchor="middle" font-weight="700">正常胃酸</text><text x="245" y="125" font-size="18" fill="#506875" text-anchor="middle" font-weight="400">参与胃内消化</text><rect x="45" y="198" width="400" height="115" rx="18" fill="white" stroke="#287F85" stroke-width="2"></rect><text x="245" y="240" font-size="25" fill="#287F85" text-anchor="middle" font-weight="700">反流现象</text><text x="245" y="275" font-size="18" fill="#506875" text-anchor="middle" font-weight="400">胃内容物进入食管</text><rect x="45" y="348" width="400" height="115" rx="18" fill="white" stroke="#287F85" stroke-width="2"></rect><text x="245" y="390" font-size="25" fill="#287F85" text-anchor="middle" font-weight="700">课堂解释</text><text x="245" y="425" font-size="18" fill="#506875" text-anchor="middle" font-weight="400">强调胃酸不足</text><rect x="550" y="48" width="400" height="115" rx="18" fill="white" stroke="#287F85" stroke-width="2"></rect><text x="750" y="90" font-size="25" fill="#287F85" text-anchor="middle" font-weight="700">临床区分</text><text x="750" y="125" font-size="18" fill="#506875" text-anchor="middle" font-weight="400">括约肌、症状与检查</text><rect x="550" y="198" width="400" height="115" rx="18" fill="white" stroke="#287F85" stroke-width="2"></rect><text x="750" y="240" font-size="25" fill="#287F85" text-anchor="middle" font-weight="700">处理原则</text><text x="750" y="275" font-size="18" fill="#506875" text-anchor="middle" font-weight="400">按病情选择干预</text><rect x="550" y="348" width="400" height="115" rx="18" fill="white" stroke="#287F85" stroke-width="2"></rect><text x="750" y="390" font-size="25" fill="#287F85" text-anchor="middle" font-weight="700">纠偏重点</text><text x="750" y="425" font-size="18" fill="#506875" text-anchor="middle" font-weight="400">不要自行停抑酸药</text><text x="500" y="550" font-size="20" fill="#607880" text-anchor="middle" font-weight="400">分开概念，逐项理解；不把两列视作等式</text></g></svg>