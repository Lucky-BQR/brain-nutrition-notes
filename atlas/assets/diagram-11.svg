<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="580" viewBox="0 0 1000 580" role="img" aria-label="SIBO 与肠屏障：两条不同线关系图"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#416D96"></path></marker></defs><rect width="1000" height="580" rx="24" fill="#EDF5F6"></rect><g font-family="Microsoft YaHei,Arial,sans-serif"><rect x="485" y="35" width="2" height="465" fill="#C8DADD"></rect><rect x="45" y="48" width="400" height="115" rx="18" fill="white" stroke="#416D96" stroke-width="2"></rect><text x="245" y="90" font-size="25" fill="#416D96" text-anchor="middle" font-weight="700">SIBO</text><text x="245" y="125" font-size="18" fill="#506875" text-anchor="middle" font-weight="400">小肠细菌过度生长</text><rect x="45" y="198" width="400" height="115" rx="18" fill="white" stroke="#416D96" stroke-width="2"></rect><text x="245" y="240" font-size="25" fill="#416D96" text-anchor="middle" font-weight="700">可能症状</text><text x="245" y="275" font-size="18" fill="#506875" text-anchor="middle" font-weight="400">胀气、腹泻等</text><rect x="45" y="348" width="400" height="115" rx="18" fill="white" stroke="#416D96" stroke-width="2"></rect><text x="245" y="390" font-size="25" fill="#416D96" text-anchor="middle" font-weight="700">检查解释</text><text x="245" y="425" font-size="18" fill="#506875" text-anchor="middle" font-weight="400">结合病史与检测</text><rect x="550" y="48" width="400" height="115" rx="18" fill="white" stroke="#416D96" stroke-width="2"></rect><text x="750" y="90" font-size="25" fill="#416D96" text-anchor="middle" font-weight="700">肠屏障</text><text x="750" y="125" font-size="18" fill="#506875" text-anchor="middle" font-weight="400">选择性通透与防御</text><rect x="550" y="198" width="400" height="115" rx="18" fill="white" stroke="#416D96" stroke-width="2"></rect><text x="750" y="240" font-size="25" fill="#416D96" text-anchor="middle" font-weight="700">通透性改变</text><text x="750" y="275" font-size="18" fill="#506875" text-anchor="middle" font-weight="400">存在于多种情境</text><rect x="550" y="348" width="400" height="115" rx="18" fill="white" stroke="#416D96" stroke-width="2"></rect><text x="750" y="390" font-size="25" fill="#416D96" text-anchor="middle" font-weight="700">不能跨越</text><text x="750" y="425" font-size="18" fill="#506875" text-anchor="middle" font-weight="400">症状不能证明全身病因</text><text x="500" y="550" font-size="20" fill="#607880" text-anchor="middle" font-weight="400">分开概念，逐项理解；不把两列视作等式</text></g></svg>