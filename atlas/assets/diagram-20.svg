<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="580" viewBox="0 0 1000 580" role="img" aria-label="血糖与断食：区分研究和执行关系图"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#6D638B"></path></marker></defs><rect width="1000" height="580" rx="24" fill="#EDF5F6"></rect><g font-family="Microsoft YaHei,Arial,sans-serif"><rect x="485" y="35" width="2" height="465" fill="#C8DADD"></rect><rect x="45" y="48" width="400" height="115" rx="18" fill="white" stroke="#6D638B" stroke-width="2"></rect><text x="245" y="90" font-size="25" fill="#6D638B" text-anchor="middle" font-weight="700">进食状态</text><text x="245" y="125" font-size="18" fill="#506875" text-anchor="middle" font-weight="400">营养输入与利用</text><rect x="45" y="198" width="400" height="115" rx="18" fill="white" stroke="#6D638B" stroke-width="2"></rect><text x="245" y="240" font-size="25" fill="#6D638B" text-anchor="middle" font-weight="700">禁食状态</text><text x="245" y="275" font-size="18" fill="#506875" text-anchor="middle" font-weight="400">底物利用发生变化</text><rect x="45" y="348" width="400" height="115" rx="18" fill="white" stroke="#6D638B" stroke-width="2"></rect><text x="245" y="390" font-size="25" fill="#6D638B" text-anchor="middle" font-weight="700">研究概念</text><text x="245" y="425" font-size="18" fill="#506875" text-anchor="middle" font-weight="400">自噬与代谢通路</text><rect x="550" y="48" width="400" height="115" rx="18" fill="white" stroke="#6D638B" stroke-width="2"></rect><text x="750" y="90" font-size="25" fill="#6D638B" text-anchor="middle" font-weight="700">个体条件</text><text x="750" y="125" font-size="18" fill="#506875" text-anchor="middle" font-weight="400">疾病、药物、营养状态</text><rect x="550" y="198" width="400" height="115" rx="18" fill="white" stroke="#6D638B" stroke-width="2"></rect><text x="750" y="240" font-size="25" fill="#6D638B" text-anchor="middle" font-weight="700">低血糖</text><text x="750" y="275" font-size="18" fill="#506875" text-anchor="middle" font-weight="400">需要及时识别和处理</text><rect x="550" y="348" width="400" height="115" rx="18" fill="white" stroke="#6D638B" stroke-width="2"></rect><text x="750" y="390" font-size="25" fill="#6D638B" text-anchor="middle" font-weight="700">行动边界</text><text x="750" y="425" font-size="18" fill="#506875" text-anchor="middle" font-weight="400">不套用长时间断食表</text><text x="500" y="550" font-size="20" fill="#607880" text-anchor="middle" font-weight="400">分开概念，逐项理解；不把两列视作等式</text></g></svg>