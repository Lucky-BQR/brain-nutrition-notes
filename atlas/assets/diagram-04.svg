<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="580" viewBox="0 0 1000 580" role="img" aria-label="消化系统的协作地图关系图"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#287F85"></path></marker></defs><rect width="1000" height="580" rx="24" fill="#EDF5F6"></rect><g font-family="Microsoft YaHei,Arial,sans-serif"><path d="M239,222 L275,222" fill="none" stroke="#287F85" stroke-width="3" marker-end="url(#arrow)"></path><path d="M489,222 L530,222" fill="none" stroke="#287F85" stroke-width="3" marker-end="url(#arrow)"></path><path d="M744,222 L780,222" fill="none" stroke="#287F85" stroke-width="3" marker-end="url(#arrow)"></path><path d="M382,122 L625,170" fill="none" stroke="#287F85" stroke-width="3" marker-end="url(#arrow)"></path><path d="M637,122 L637,170" fill="none" stroke="#287F85" stroke-width="3" marker-end="url(#arrow)"></path><rect x="25" y="170" width="214" height="104" rx="18" fill="white" stroke="#287F85" stroke-width="2"></rect><text x="132" y="212" font-size="25" fill="#287F85" text-anchor="middle" font-weight="700">口腔与食管</text><text x="132" y="247" font-size="18" fill="#506875" text-anchor="middle" font-weight="400">咀嚼、唾液、运送</text><rect x="275" y="170" width="214" height="104" rx="18" fill="white" stroke="#287F85" stroke-width="2"></rect><text x="382" y="212" font-size="25" fill="#287F85" text-anchor="middle" font-weight="700">胃</text><text x="382" y="247" font-size="18" fill="#506875" text-anchor="middle" font-weight="400">储存、搅拌与酸性环境</text><rect x="275" y="18" width="214" height="104" rx="18" fill="white" stroke="#287F85" stroke-width="2"></rect><text x="382" y="60" font-size="25" fill="#287F85" text-anchor="middle" font-weight="700">肝与胆囊</text><text x="382" y="95" font-size="18" fill="#506875" text-anchor="middle" font-weight="400">产生、储存和释放胆汁</text><rect x="530" y="18" width="214" height="104" rx="18" fill="white" stroke="#287F85" stroke-width="2"></rect><text x="637" y="60" font-size="25" fill="#287F85" text-anchor="middle" font-weight="700">胰腺</text><text x="637" y="95" font-size="18" fill="#506875" text-anchor="middle" font-weight="400">提供消化酶等分泌物</text><rect x="530" y="170" width="214" height="104" rx="18" fill="white" stroke="#287F85" stroke-width="2"></rect><text x="637" y="212" font-size="25" fill="#287F85" text-anchor="middle" font-weight="700">小肠</text><text x="637" y="247" font-size="18" fill="#506875" text-anchor="middle" font-weight="400">消化与营养吸收</text><rect x="780" y="170" width="205" height="104" rx="18" fill="white" stroke="#287F85" stroke-width="2"></rect><text x="882.5" y="212" font-size="25" fill="#287F85" text-anchor="middle" font-weight="700">大肠</text><text x="882.5" y="247" font-size="18" fill="#506875" text-anchor="middle" font-weight="400">回收水分、形成粪便</text><text x="500" y="365" font-size="27" fill="#287F85" text-anchor="middle" font-weight="400">食物主通道：口腔 / 食管 → 胃 → 小肠 → 大肠</text><text x="500" y="415" font-size="23" fill="#183F4D" text-anchor="middle" font-weight="400">肝胆与胰腺提供旁路分泌，不是食物经过的通道</text><text x="500" y="490" font-size="18" fill="#667E88" text-anchor="middle" font-weight="400">示意位置，不按解剖比例</text></g></svg>